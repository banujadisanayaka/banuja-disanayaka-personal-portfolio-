<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090d" />
  <meta name="robots" content="noindex,follow" />
  <meta name="description" content="This portfolio route does not exist. Return to Banuja Disanayaka’s selected work and creative systems portfolio." />
  <title>404 — Banuja Disanayaka</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090d;color:#f4f0e7}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,rgba(214,170,99,.12),transparent 30rem),#07090d}
    main{width:min(1120px,calc(100% - 36px));padding:56px 0}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#767d87;margin:0 0 24px}
    h1{margin:0;font-size:clamp(86px,19vw,260px);line-height:.74;letter-spacing:-.08em;font-weight:800}.outline{display:block;color:transparent;-webkit-text-stroke:1px rgba(244,240,231,.68)}
    .grid{margin-top:56px;display:grid;grid-template-columns:1fr minmax(260px,.55fr);gap:48px;align-items:end;border-top:1px solid rgba(255,255,255,.12);padding-top:28px}
    p{margin:0;color:#9ba1a9;font-size:clamp(16px,1.4vw,21px);line-height:1.6;max-width:620px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
    a{color:inherit;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:13px 16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}a.primary{background:#f4f0e7;color:#07090d;border-color:#f4f0e7}a:focus-visible{outline:2px solid #d6aa63;outline-offset:4px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <p class="kicker">SYSTEM / ROUTE NOT FOUND</p>
    <h1>404<span class="outline">OFF MAP.</span></h1>
    <div class="grid">
      <p>The route you followed is not part of this portfolio. The work is still here — return to the main experience or jump directly to selected projects.</p>
      <div class="actions">
        <a class="primary" href="/">Return home ↗</a>
        <a href="/#work">Selected work →</a>
      </div>
    </div>
  </main>
</body>
</html>
