name: Netlify Build Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-immersive-redesign]

permissions:
  contents: read

concurrency:
  group: netlify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production dependencies
        run: npm install --no-audit --no-fund

      - name: Run Netlify build locally
        run: npx --yes netlify-cli@latest build
