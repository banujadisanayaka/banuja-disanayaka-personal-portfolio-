name: Netlify Build Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-immersive-redesign]

permissions:
  contents: read

concurrency:
  group: netlify-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_SITE_ID: caf01a3b-bf76-42af-8fd9-d8a67dbf0c7f
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install production dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Netlify build locally
        run: npx --yes netlify-cli@27.4.2 build --offline --context deploy-preview
