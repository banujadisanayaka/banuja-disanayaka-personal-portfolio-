name: Portfolio QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-immersive-redesign]

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Static production QA
        run: node scripts/portfolio-qa.mjs

      - name: Responsive and motion resilience QA
        run: node scripts/responsive-qa.mjs

      - name: Backend security regression QA
        run: node scripts/security-qa.mjs

      - name: CMS atomic concurrency QA
        run: node scripts/cms-concurrency-qa.mjs
