name: Portfolio QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-immersive-redesign]

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Static production QA
        run: node scripts/portfolio-qa.mjs

      - name: Responsive and motion resilience QA
        run: node scripts/responsive-qa.mjs

      - name: Backend security regression QA
        run: node scripts/security-qa.mjs

      - name: CMS atomic concurrency QA
        run: node scripts/cms-concurrency-qa.mjs


  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned browser test runtime
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 4173 -d public >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Browser accessibility and responsive QA
        run: node scripts/browser-qa.mjs
