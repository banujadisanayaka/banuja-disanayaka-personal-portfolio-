name: Portfolio QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v8-immersive-redesign]

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build release and responsive media
        run: node scripts/build-derivatives.mjs && node scripts/build-site.mjs

      - name: Release content, migration and media QA
        run: node scripts/release-qa.mjs && node scripts/seo-qa.mjs

      - name: Backend security regression QA
        run: node scripts/security-qa.mjs

      - name: CMS atomic concurrency QA
        run: node scripts/cms-concurrency-qa.mjs

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned browser test runtime
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Select browser QA target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=https://deploy-preview-${{ github.event.pull_request.number }}--banujadisanayaka.netlify.app" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "remote=true" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://127.0.0.1:4173" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "remote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start static preview for branch pushes
        if: steps.target.outputs.remote == 'false'
        run: |
          node scripts/build-derivatives.mjs
          node scripts/build-site.mjs
          node scripts/build-info.mjs
          python3 -m http.server 4173 -d public >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Wait for exact Netlify deploy preview
        if: steps.target.outputs.remote == 'true'
        env:
          QA_URL: ${{ steps.target.outputs.url }}
          EXPECTED_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          for i in {1..60}; do
            BODY="$(curl -fsS "$QA_URL/build-info.json" 2>/dev/null || true)"
            echo "$BODY" | grep -q "$EXPECTED_COMMIT" && exit 0
            sleep 5
          done
          echo "Timed out waiting for deploy preview commit $EXPECTED_COMMIT"
          exit 1

      - name: Verify deployed API privacy and auth boundaries
        if: steps.target.outputs.remote == 'true'
        env:
          QA_URL: ${{ steps.target.outputs.url }}
        run: |
          for i in {1..18}; do
            CONTENT_CODE="$(curl -sS -D /tmp/content-headers -o /tmp/content-body -w '%{http_code}' "$QA_URL/api/content" || true)"
            SESSION_CODE="$(curl -sS -o /tmp/session-body -w '%{http_code}' "$QA_URL/api/admin-session" || true)"
            ADMIN_CODE="$(curl -sS -o /tmp/admin-body -w '%{http_code}' "$QA_URL/api/admin-content" || true)"
            if [ "$CONTENT_CODE" = "200" ] && [ "$SESSION_CODE" = "401" ] && [ "$ADMIN_CODE" = "401" ]; then break; fi
            echo "Waiting for function boundaries: content=$CONTENT_CODE session=$SESSION_CODE admin=$ADMIN_CODE"
            sleep 5
          done
          test "$CONTENT_CODE" = "200"
          test "$SESSION_CODE" = "401"
          test "$ADMIN_CODE" = "401"
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/content-headers
          grep -qi '^referrer-policy: no-referrer' /tmp/content-headers
          grep -qi '^cross-origin-resource-policy: same-origin' /tmp/content-headers

      - name: V10 browser accessibility and responsive QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/v10-browser-qa.mjs

      - name: Cinematic scene journey QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/scene-journey-qa.mjs

      - name: Project work browser QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/work-browser-qa.mjs

      - name: Release browser QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/release-browser-qa.mjs

      - name: Experience browser QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/experience-browser-qa.mjs

      - name: V12.1 browser QA
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/v12-1-browser-qa.mjs

      - name: Capture V12.1 cinematic visual review
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/v12-1-visual-qa.mjs

      - name: Mobile scroll performance regression
        env:
          BROWSER_QA_BASE_URL: ${{ steps.target.outputs.url }}
          PERFORMANCE_BASELINE_URL: ${{ github.event_name == 'pull_request' && 'https://banujadisanayaka.netlify.app/' || '' }}
        run: node scripts/performance-browser-qa.mjs

      - name: Verify V12.1 visual review bundle
        if: always()
        shell: bash
        run: |
          test -d qa-artifacts/v12-1
          COUNT="$(find qa-artifacts/v12-1 -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "V12.1 visual PNG count: $COUNT"
          find qa-artifacts/v12-1 -maxdepth 1 -type f -name '*.png' -print | sort
          test "$COUNT" -eq 10

      - name: Save V12.1 visual verification
        id: v121_visual_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-visual-qa
          path: qa-artifacts/v12-1/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve V12.1 review images if artifact storage is unavailable
        if: always() && steps.v121_visual_artifact.outcome == 'failure'
        run: node scripts/v12-1-visual-log.mjs

      - name: Save V10 visual verification
        id: v10_visual_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v10-visual-qa
          path: qa-artifacts/v10/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve V10 review images if artifact storage is unavailable
        if: always() && steps.v10_visual_artifact.outcome == 'failure'
        run: node scripts/v10-visual-log.mjs

      - name: Save project carousel visual verification
        id: work_visual_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: work-carousel-visual-qa
          path: qa-artifacts/work/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve review images in logs if artifact storage is unavailable
        if: always() && steps.work_visual_artifact.outcome == 'failure'
        run: node scripts/work-visual-log.mjs
